<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 22px;
    background: #17191e;
    color: #eeeeee;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.logo {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #303b50;
    border-radius: 12px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -1px;
    color: white;
}
h1 { font-size: 21px; margin: 15px 0 4px; }
.subtitle {
    color: #8994a5;
    font-size: 10px;
    letter-spacing: 2px;
}
hr {
    border: 0;
    border-top: 1px solid #30343c;
    margin: 22px 0;
}
.description {
    color: #aeb5c1;
    font-size: 13px;
    line-height: 1.6;
}
footer {
    position: absolute;
    bottom: 20px;
    color: #737c8b;
    font-size: 11px;
}
</style>
</head>
<body>
    <div class="logo">MC</div>
    <h1>MC TV</h1>
    <div class="subtitle">CENÁRIO VIRTUAL INTERATIVO</div>
    <div class="subtitle">PROFESSIONAL BROADCAST SYSTEM</div>
  <hr>
    <div class="description">
        Ambiente profissional de transmissão.
        <br><br>
        Desenvolvido por ADDITION.
    </div>
    <footer>MC TV · Version 1.0.0</footer>
</body>
</html>
