<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Marcos Coutinho">
  <meta property="og:description" content="Gestão de Operações • PMO • Governança • Transformação Digital">
  <meta property="og:url" content="https://mfcoutinho.github.io/Contato/">
  <meta property="og:image" content="https://mfcoutinho.github.io/Contato/assets/previews/contato.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
    
  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marcos Coutinho">
  <meta name="twitter:description" content="Gestão de Operações • PMO • Governança • Transformação Digital">
  <meta name="twitter:image" content="https://mfcoutinho.github.io/Contato/assets/previews/contato.jpg">
  
  <title>Marcos Coutinho | Contato</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0f14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .cargo {
      margin: 0 0 32px;
      color: #a9b3bf;
      line-height: 1.5;
    }

    .botao {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 16px 20px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }

    .rodape {
      margin-top: 32px;
      color: #6e7681;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main>
    <h1>Marcos Coutinho</h1>

    <p class="cargo">
      Gestão de Operações • PMO • Governança<br>
      Transformação Digital
    </p>

    <a class="botao" href="marcos-coutinho.vcf">
      Add contato de Cel.
    </a>

    <a class="botao" href="https://www.linkedin.com/in/mfcoutinho/">
      LinkedIn
    </a>

    <a class="botao"
       href="https://wa.me/5521996257146?text=Olá%20Marcos,%20meu%20nome%20é%20">
      WhatsApp
    </a>

    <button class="botao" onclick="copiarEmail(this)">
      Copiar e-mail
    </button>
    
    <script>
      function copiarEmail(botao) {
        navigator.clipboard.writeText('mfcoutinho@gmail.com').then(() => {
          const textoOriginal = botao.innerText;
    
          botao.innerText = 'E-mail copiado ✓';
    
          setTimeout(() => {
            botao.innerText = textoOriginal;
          }, 2000);
        });
      }
    </script>

    <a class="botao" href="https://calendar.app.google/GNgMzCr4fJtVLNtJA">
      Agendar reunião
    </a>

    <p class="rodape">
      Página de contato digital
    </p>
  </main>

</body>
</html>
