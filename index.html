<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07101b">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Marcos Coutinho">
  <meta property="og:description" content="Gestão de Operações • PMO • Governança • Transformação Digital">
  <meta property="og:url" content="https://mfcoutinho.github.io/Contato/">
  <meta property="og:image" content="https://mfcoutinho.github.io/Contato/assets/previews/contato.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
    
  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marcos Coutinho">
  <meta name="twitter:description" content="Gestão de Operações • PMO • Governança • Transformação Digital">
  <meta name="twitter:image" content="https://mfcoutinho.github.io/Contato/assets/previews/contato.jpg">

  <title>Marcos Coutinho | Contato</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      background: #07101b;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
    }


    /* =========================================================
       PÁGINA
    ========================================================= */

    .pagina {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100svh;

      min-height: 600px;

      overflow: hidden;

      color: #ffffff;

      isolation: isolate;
    }


    /* =========================================================
       FUNDO
    ========================================================= */

    .fundo {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 0;

      pointer-events: none;
      user-select: none;
    }


    /* =========================================================
       SOMBREAMENTO PARA LEGIBILIDADE
    ========================================================= */

    .pagina::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.02) 45%,
          rgba(0, 0, 0, 0.22) 100%
        );
    }


    /* =========================================================
       NOME
       FICA ATRÁS DO PERSONAGEM
    ========================================================= */

    .nome {
      position: absolute;

      left: 6%;
      top: 11%;

      z-index: 2;

      margin: 0;

      font-size: clamp(34px, 5.2vw, 82px);
      font-weight: 800;

      line-height: 0.92;

      letter-spacing: -0.055em;

      white-space: nowrap;

      pointer-events: none;

      animation: entradaNome 900ms ease-out both;
    }

    .nome .primeiro {
      color: #ffffff;
    }

    .nome .sobrenome {
      color: #1b9cff;
    }


    /* =========================================================
       PERSONAGEM
    ========================================================= */

    .personagem {
      position: absolute;

      left: 1.5%;
      bottom: 0;

      height: 91%;

      z-index: 3;

      pointer-events: none;
      user-select: none;

      animation: entradaPersonagem 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .personagem img {
      display: block;

      width: auto;
      height: 100%;

      object-fit: contain;
      object-position: bottom left;
    }


    /* =========================================================
       ÁREA DOS BOTÕES
    ========================================================= */

    .acoes {
      position: absolute;

      right: 7%;
      top: 50%;

      transform: translateY(-50%);

      z-index: 4;

      width: min(37vw, 430px);

      display: flex;
      flex-direction: column;

      gap: 13px;
    }


    /* =========================================================
       BOTÕES
    ========================================================= */

    .botao {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 58px;

      padding: 14px 24px;

      border: 1px solid rgba(255,255,255,.24);
      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(15, 29, 46, .88),
          rgba(8, 18, 31, .94)
        );

      box-shadow:
        0 8px 28px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.08);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: #ffffff;

      text-decoration: none;

      font-size: 17px;
      font-weight: 600;

      letter-spacing: .01em;

      cursor: pointer;

      appearance: none;
      -webkit-appearance: none;

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;

      opacity: 0;

      animation:
        entradaBotao 600ms cubic-bezier(.2,.8,.2,1) forwards;
    }


    .botao:nth-child(1) {
      animation-delay: 300ms;
    }

    .botao:nth-child(2) {
      animation-delay: 410ms;
    }

    .botao:nth-child(3) {
      animation-delay: 520ms;
    }

    .botao:nth-child(4) {
      animation-delay: 630ms;
    }

    .botao:nth-child(5) {
      animation-delay: 740ms;
    }


    .botao:hover {
      transform: translateX(-7px);

      border-color: rgba(61,169,255,.75);

      background:
        linear-gradient(
          135deg,
          rgba(20, 49, 76, .96),
          rgba(9, 26, 43, .98)
        );

      box-shadow:
        0 12px 32px rgba(0,0,0,.27),
        0 0 0 1px rgba(27,156,255,.14);
    }


    .botao:active {
      transform:
        translateX(-4px)
        scale(.985);
    }


    .botao:focus-visible {
      outline: 2px solid #38a9ff;
      outline-offset: 3px;
    }


    /* =========================================================
       BRAÇO

       Camada independente, sobre o corpo.
       A posição poderá ser refinada depois sem alterar
       o restante do layout.
    ========================================================= */

    .braco {
      position: absolute;

      left: 31%;
      top: 42%;

      width: 31vw;
      max-width: 500px;

      z-index: 5;

      pointer-events: none;
      user-select: none;

      transform-origin: left center;

      animation:
        entradaBraco 1000ms cubic-bezier(.2,.8,.2,1) 350ms both;
    }

    .braco img {
      display: block;

      width: 100%;
      height: auto;
    }


    /* =========================================================
       ASSINATURA
    ========================================================= */

    .assinatura {
      position: absolute;

      left: 5%;
      bottom: 3.2%;

      z-index: 6;

      width: clamp(130px, 14vw, 230px);

      opacity: .94;

      pointer-events: none;
      user-select: none;

      animation: entradaAssinatura 900ms ease-out 850ms both;
    }

    .assinatura img {
      display: block;

      width: 100%;
      height: auto;
    }


    /* =========================================================
       ANIMAÇÕES
    ========================================================= */

    @keyframes entradaPersonagem {

      from {
        opacity: 0;
        transform: translateX(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }


    @keyframes entradaNome {

      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes entradaBotao {

      from {
        opacity: 0;
        transform: translateX(28px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }


    @keyframes entradaBraco {

      from {
        opacity: 0;
        transform:
          translateX(-18px)
          rotate(-3deg);
      }

      to {
        opacity: 1;
        transform:
          translateX(0)
          rotate(0);
      }

    }


    @keyframes entradaAssinatura {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: .94;
        transform: translateY(0);
      }

    }


    /* =========================================================
       TABLET / MOBILE
    ========================================================= */

    @media (max-width: 760px) {

      .pagina {
        min-height: 100svh;
      }


      .fundo {
        object-position: center center;
      }


      .nome {
        left: 6%;
        top: 7%;

        font-size: clamp(31px, 10vw, 48px);
      }


      .personagem {
        left: -13%;
        bottom: 0;

        height: 78%;
      }


      .acoes {
        right: 5%;
        top: 46%;

        width: 51%;
        max-width: 260px;

        gap: 9px;
      }


      .botao {
        min-height: 50px;

        padding: 11px 10px;

        border-radius: 12px;

        font-size: clamp(13px, 3.7vw, 16px);
      }


      .braco {
        left: 27%;
        top: 43%;

        width: 42vw;
      }


      .assinatura {
        left: 4%;
        bottom: 2%;

        width: 120px;
      }

    }


    /* =========================================================
       TELAS MUITO ESTREITAS
    ========================================================= */

    @media (max-width: 390px) {

      .personagem {
        left: -18%;
        height: 75%;
      }


      .acoes {
        right: 4%;
        width: 53%;
      }


      .botao {
        min-height: 47px;
        font-size: 13px;
      }


      .braco {
        left: 25%;
        width: 45vw;
      }

    }


    /* =========================================================
       REDUZIR ANIMAÇÃO QUANDO SOLICITADO PELO SISTEMA
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }

    }

  </style>
</head>


<body>

  <main class="pagina">


    <!-- FUNDO -->
    <img
      class="fundo"
      src="./img/Lnkt_mfc_bg.png"
      alt=""
      aria-hidden="true"
    >


    <!-- NOME -->
    <h1 class="nome">
      <span class="primeiro">Marcos</span>
      <span class="sobrenome">Coutinho</span>
    </h1>


    <!-- CORPO -->
    <div class="personagem">
      <img
        src="./img/Lnkt_mfc_corpo-todo.png"
        alt="Marcos Coutinho"
      >
    </div>


    <!-- BOTÕES -->
    <nav class="acoes" aria-label="Contato">

      <a
        class="botao"
        href="./marcos-coutinho.vcf"
        download
      >
        Adicionar contato
      </a>


      <a
        class="botao"
        href="https://www.linkedin.com/in/mfcoutinho/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>


      <a
        class="botao"
        href="https://wa.me/5521996257146?text=Olá%20Marcos,%20meu%20nome%20é%20"
        target="_blank"
        rel="noopener noreferrer"
      >
        WhatsApp
      </a>


      <button
        class="botao"
        type="button"
        id="botao-email"
        onclick="copiarEmail(this)"
      >
        Copiar e-mail
      </button>


      <a
        class="botao"
        href="https://calendar.app.google/GNgMzCr4fJtVLNtJA"
        target="_blank"
        rel="noopener noreferrer"
      >
        Agendar reunião
      </a>

    </nav>


    <!-- BRAÇO / MÃO -->
    <div class="braco">
      <img
        src="./img/Lnkt_mfc_braco.png"
        alt=""
        aria-hidden="true"
      >
    </div>


    <!-- ASSINATURA -->
    <div class="assinatura">
      <img
        src="./img/Marcos Coutinho - Assinatura Branca.png"
        alt="Marcos Coutinho"
      >
    </div>


  </main>


  <script>

    async function copiarEmail(botao) {

      const email = "mfcoutinho@gmail.com";
      const textoOriginal = "Copiar e-mail";

      try {

        await navigator.clipboard.writeText(email);

        botao.textContent = "E-mail copiado ✓";

        setTimeout(() => {
          botao.textContent = textoOriginal;
        }, 2000);

      } catch (erro) {

        /*
          Fallback para navegadores onde Clipboard API
          não estiver disponível.
        */

        const campo = document.createElement("textarea");

        campo.value = email;
        campo.style.position = "fixed";
        campo.style.opacity = "0";

        document.body.appendChild(campo);

        campo.focus();
        campo.select();

        document.execCommand("copy");

        campo.remove();

        botao.textContent = "E-mail copiado ✓";

        setTimeout(() => {
          botao.textContent = textoOriginal;
        }, 2000);

      }

    }

  </script>

</body>
</html>
