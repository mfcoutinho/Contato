<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#07101b">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Marcos Coutinho">
  <meta property="og:description" content="Gestão de Operações • PMO • Governança • Transformação Digital">
  <meta property="og:url" content="https://mfcoutinho.github.io/Contato/">
  <meta property="og:image" content="https://mfcoutinho.github.io/Contato/assets/previews/contato.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
    
  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marcos Coutinho">
  <meta name="twitter:description" content="Gestão de Operações • PMO • Governança • Transformação Digital">
  <meta name="twitter:image" content="https://mfcoutinho.github.io/Contato/assets/previews/contato.jpg">
  <title>Marcos Coutinho | Contato</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    html {
      background: #050a10;
    }

    body {
      min-height: 100svh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050a10;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
    }


    /* =========================================================
       COMPOSIÇÃO PRINCIPAL
       Formato vertical controlado em qualquer tela
    ========================================================= */

    .pagina {
      position: relative;

      height: 100svh;
      width: min(100vw, calc(100svh * 0.60));

      max-height: 1100px;
      max-width: 660px;

      overflow: hidden;

      background: #07101b;

      isolation: isolate;

      box-shadow:
        0 0 60px rgba(0, 0, 0, .65);
    }


    /* =========================================================
       FUNDO
    ========================================================= */

    .fundo {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 0;

      pointer-events: none;
      user-select: none;
    }


    /* =========================================================
       LEVE SOMBREAMENTO
    ========================================================= */

    .pagina::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, .05) 0%,
          rgba(0, 0, 0, 0) 48%,
          rgba(0, 0, 0, .13) 100%
        );
    }


    /* =========================================================
       NOME
       Atrás do personagem
    ========================================================= */

    .nome {
      position: absolute;

      top: 18.5%;
      left: 39%;

      z-index: 2;

      margin: 0;

      line-height: .82;

      font-weight: 700;

      letter-spacing: -.055em;

      pointer-events: none;

      animation:
        entradaNome 900ms ease-out both;
    }

    .nome .primeiro,
    .nome .sobrenome {
      display: block;
      white-space: nowrap;
    }

    .nome .primeiro {
      margin-left: 0;

      color: rgba(255, 255, 255, .28);

      font-size: clamp(30px, 5.7vh, 61px);

      font-weight: 400;
    }

    .nome .sobrenome {
      margin-left: 5%;

      color: rgba(0, 126, 218, .67);

      font-size: clamp(42px, 7.2vh, 78px);

      font-weight: 700;
    }


    /* =========================================================
       CORPO
    ========================================================= */

    .personagem {
      position: absolute;

      left: -13%;
      bottom: 0;

      height: 86%;

      z-index: 3;

      pointer-events: none;
      user-select: none;

      animation:
        entradaPersonagem
        900ms
        cubic-bezier(.2, .8, .2, 1)
        both;
    }

    .personagem img {
      display: block;

      width: auto;
      height: 100%;

      object-fit: contain;
      object-position: bottom left;
    }


    /* =========================================================
       BOTÕES
    ========================================================= */

    .acoes {
      position: absolute;

      top: 32%;
      right: 4.7%;

      z-index: 5;

      width: 54%;

      display: flex;
      flex-direction: column;

      gap: 1.05vh;
    }


    .botao {
      position: relative;

      display: grid;

      grid-template-columns:
        clamp(42px, 6.6vh, 66px)
        1fr
        22px;

      align-items: center;

      width: 100%;

      min-height: clamp(68px, 8.6vh, 92px);

      padding:
        clamp(8px, 1.1vh, 12px)
        clamp(12px, 1.6vh, 18px);

      border:
        1.5px solid
        rgba(153, 205, 238, .72);

      border-radius:
        clamp(17px, 2.2vh, 25px);

      background:
        linear-gradient(
          100deg,
          rgba(4, 24, 39, .80),
          rgba(6, 20, 32, .72)
        );

      box-shadow:
        0 7px 22px rgba(0, 0, 0, .18),
        inset 0 1px 0 rgba(255, 255, 255, .04);

      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);

      color: #fff;

      text-decoration: none;

      cursor: pointer;

      appearance: none;
      -webkit-appearance: none;

      opacity: 0;

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;

      animation:
        entradaBotao
        550ms
        cubic-bezier(.2, .8, .2, 1)
        forwards;
    }


    /* BOTÃO PRINCIPAL */

    .botao.destaque {
      border-color: #009dff;

      box-shadow:
        0 0 0 1px rgba(0, 157, 255, .25),
        0 0 18px rgba(0, 157, 255, .28),
        inset 0 1px 0 rgba(255, 255, 255, .08);

      background:
        linear-gradient(
          100deg,
          rgba(6, 41, 66, .87),
          rgba(7, 25, 40, .78)
        );
    }


    /* =========================================================
       ÍCONES
    ========================================================= */

    .icone {
      display: flex;

      align-items: center;
      justify-content: center;

      width: clamp(42px, 6.1vh, 62px);
      height: clamp(42px, 6.1vh, 62px);

      justify-self: start;
    }

    .icone img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;
      user-select: none;
    }


    /* =========================================================
       TEXTO DOS BOTÕES
    ========================================================= */

    .texto-botao {
      padding-left: clamp(8px, 1.4vh, 15px);

      text-align: left;

      font-size:
        clamp(16px, 2.45vh, 25px);

      font-weight: 500;

      line-height: 1.13;
    }


    /* =========================================================
       SETA
    ========================================================= */

    .seta {
      justify-self: end;

      color: #fff;

      font-size:
        clamp(28px, 4vh, 42px);

      font-weight: 300;

      line-height: 1;

      transform: translateY(-1px);
    }


    /* =========================================================
       ENTRADA SEQUENCIAL
    ========================================================= */

    .botao:nth-child(1) {
      animation-delay: 300ms;
    }

    .botao:nth-child(2) {
      animation-delay: 410ms;
    }

    .botao:nth-child(3) {
      animation-delay: 520ms;
    }

    .botao:nth-child(4) {
      animation-delay: 630ms;
    }

    .botao:nth-child(5) {
      animation-delay: 740ms;
    }


    .botao:hover {
      transform: translateX(-5px);

      border-color: #13a8ff;

      background:
        linear-gradient(
          100deg,
          rgba(7, 48, 75, .92),
          rgba(7, 25, 40, .88)
        );

      box-shadow:
        0 0 17px rgba(0, 157, 255, .20),
        inset 0 1px 0 rgba(255, 255, 255, .07);
    }


    .botao:active {
      transform:
        translateX(-3px)
        scale(.985);
    }


    .botao:focus-visible {
      outline: 2px solid #1ba7ff;
      outline-offset: 3px;
    }


    /* =========================================================
       BRAÇO
    ========================================================= */

    .braco {
      position: absolute;

      left: 20%;
      top: 39.4%;

      z-index: 6;

      width: 27%;

      pointer-events: none;
      user-select: none;

      transform-origin: left center;

      animation:
        entradaBraco
        900ms
        cubic-bezier(.2, .8, .2, 1)
        350ms
        both;
    }

    .braco img {
      display: block;

      width: 100%;
      height: auto;
    }


    /* =========================================================
       ASSINATURA
    ========================================================= */

    .assinatura {
      position: absolute;

      right: 9%;
      bottom: 4.2%;

      z-index: 7;

      width: 32%;

      pointer-events: none;
      user-select: none;

      opacity: .96;

      animation:
        entradaAssinatura
        900ms
        ease-out
        850ms
        both;
    }

    .assinatura img {
      display: block;

      width: 100%;
      height: auto;
    }


    /* =========================================================
       ANIMAÇÕES
    ========================================================= */

    @keyframes entradaPersonagem {

      from {
        opacity: 0;
        transform: translateX(-25px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }


    @keyframes entradaNome {

      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes entradaBotao {

      from {
        opacity: 0;
        transform: translateX(24px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }


    @keyframes entradaBraco {

      from {
        opacity: 0;
        transform:
          translateX(-12px)
          rotate(-2deg);
      }

      to {
        opacity: 1;
        transform:
          translateX(0)
          rotate(0deg);
      }

    }


    @keyframes entradaAssinatura {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: .96;
        transform: translateY(0);
      }

    }


    /* =========================================================
       CELULARES ESTREITOS
    ========================================================= */

    @media (max-aspect-ratio: 9 / 16) {

      .pagina {
        width: 100vw;
        height: 100svh;
        max-width: none;
        max-height: none;
      }

    }


    /* =========================================================
       DESKTOP / TABLET HORIZONTAL
       Mantém a composição vertical limitada
    ========================================================= */

    @media (min-aspect-ratio: 3 / 2) {

      .pagina {
        height: min(100svh, 1000px);
        width: min(
          600px,
          calc(min(100svh, 1000px) * .60)
        );
      }

    }


    /* =========================================================
       REDUÇÃO DE MOVIMENTO
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }

    }

  </style>
</head>


<body>

  <main class="pagina">


    <!-- =====================================================
         FUNDO
    ====================================================== -->

    <img
      class="fundo"
      src="./img/Lnkt_mfc_bg.png"
      alt=""
      aria-hidden="true"
    >


    <!-- =====================================================
         NOME
    ====================================================== -->

    <h1 class="nome">

      <span class="primeiro">
        Marcos
      </span>

      <span class="sobrenome">
        Coutinho
      </span>

    </h1>


    <!-- =====================================================
         PERSONAGEM
    ====================================================== -->

    <div class="personagem">

      <img
        src="./img/Lnkt_mfc_corpo-todo.png"
        alt="Marcos Coutinho"
      >

    </div>


    <!-- =====================================================
         BOTÕES
    ====================================================== -->

    <nav
      class="acoes"
      aria-label="Contato"
    >


      <!-- AGENDA -->

      <a
        class="botao destaque"
        href="https://calendar.app.google/GNgMzCr4fJtVLNtJA"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icone">

          <img
            src="./img/Ico-agenda.png"
            alt=""
            aria-hidden="true"
          >

        </span>

        <span class="texto-botao">
          Agendar<br>
          uma conversa
        </span>

        <span
          class="seta"
          aria-hidden="true"
        >
          ›
        </span>

      </a>


      <!-- WHATSAPP -->

      <a
        class="botao"
        href="https://wa.me/5521996257146?text=Olá%20Marcos,%20meu%20nome%20é%20"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icone">

          <img
            src="./img/ico-whatsapp.png"
            alt=""
            aria-hidden="true"
          >

        </span>

        <span class="texto-botao">
          WhatsApp
        </span>

        <span
          class="seta"
          aria-hidden="true"
        >
          ›
        </span>

      </a>


      <!-- LINKEDIN -->

      <a
        class="botao"
        href="https://www.linkedin.com/in/mfcoutinho/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icone">

          <img
            src="./img/ico-linkedin.png"
            alt=""
            aria-hidden="true"
          >

        </span>

        <span class="texto-botao">
          LinkedIn
        </span>

        <span
          class="seta"
          aria-hidden="true"
        >
          ›
        </span>

      </a>


      <!-- E-MAIL -->

      <button
        class="botao"
        type="button"
        onclick="copiarEmail(this)"
      >

        <span class="icone">

          <img
            src="./img/ico-email.png"
            alt=""
            aria-hidden="true"
          >

        </span>

        <span
          class="texto-botao texto-email"
        >
          Copiar e-mail
        </span>

        <span
          class="seta"
          aria-hidden="true"
        >
          ›
        </span>

      </button>


      <!-- VCARD -->

      <a
        class="botao"
        href="./marcos-coutinho.vcf"
        download
      >

        <span class="icone">

          <img
            src="./img/ico-vcard.png"
            alt=""
            aria-hidden="true"
          >

        </span>

        <span class="texto-botao">
          Ver meu card
        </span>

        <span
          class="seta"
          aria-hidden="true"
        >
          ›
        </span>

      </a>


    </nav>


    <!-- =====================================================
         BRAÇO
    ====================================================== -->

    <div class="braco">

      <img
        src="./img/Lnkt_mfc_braco.png"
        alt=""
        aria-hidden="true"
      >

    </div>


    <!-- =====================================================
         ASSINATURA
    ====================================================== -->

    <div class="assinatura">

      <img
        src="./img/Marcos Coutinho - Assinatura Branca.png"
        alt="Marcos Coutinho"
      >

    </div>


  </main>


  <script>

    async function copiarEmail(botao) {

      const email = "mfcoutinho@gmail.com";

      const elementoTexto =
        botao.querySelector(".texto-email");

      const textoOriginal =
        elementoTexto.textContent.trim();


      try {

        await navigator.clipboard.writeText(email);

        elementoTexto.textContent =
          "E-mail copiado ✓";


        setTimeout(() => {

          elementoTexto.textContent =
            textoOriginal;

        }, 2000);


      } catch (erro) {


        const campo =
          document.createElement("textarea");


        campo.value = email;

        campo.style.position = "fixed";
        campo.style.opacity = "0";


        document.body.appendChild(campo);


        campo.focus();
        campo.select();


        document.execCommand("copy");


        campo.remove();


        elementoTexto.textContent =
          "E-mail copiado ✓";


        setTimeout(() => {

          elementoTexto.textContent =
            textoOriginal;

        }, 2000);

      }

    }

  </script>

</body>

</html>
