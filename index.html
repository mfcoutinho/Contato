<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">

  <title>Marcos Coutinho | Contato</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0f14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .cargo {
      margin: 0 0 32px;
      color: #a9b3bf;
      line-height: 1.5;
    }

    .botao {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 16px 20px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }

    .rodape {
      margin-top: 32px;
      color: #6e7681;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main>
    <h1>Marcos Coutinho</h1>

    <p class="cargo">
      Gestão de Operações • PMO • Governança<br>
      Transformação Digital
    </p>

    <a class="botao" href="#">
      Salvar contato
    </a>

    <a class="botao" href="#">
      LinkedIn
    </a>

    <a class="botao" href="#">
      WhatsApp
    </a>

    <a class="botao" href="#">
      Enviar e-mail
    </a>

    <a class="botao" href="#">
      Agendar uma conversa
    </a>

    <p class="rodape">
      Página de contato digital
    </p>
  </main>

</body>
</html>
